name: ci

# CI mínima da Fase 9 (ver ROADMAP.md): build + vet + gofmt + test para os
# dois módulos Go independentes (server, client) e lint + build para o
# painel React. client-windows-crosscompile só valida que compila — não há
# runner Windows real neste projeto, a validação de runtime em Windows
# continua manual (ver PLAN.md).
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'apps/xvpn-client/**'

  marketplace-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instala PyYAML
        run: pip install --user pyyaml
      - name: Valida apps/*/marketplace.yaml
        run: python3 .github/scripts/validate-marketplace-manifests.py

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Arquivos fora do padrão gofmt:"
            echo "$fmt_out"
            exit 1
          fi
      - run: go test ./...

  client-linux:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/xvpn-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/xvpn-client/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/xvpn-client/frontend/package-lock.json
      - name: Dependências de build do Wails (GTK/WebKit — ver PLAN.md §11)
        run: |
          sudo apt-get update
          # build-essential: gcc p/ cgo (wails3 exige CGO_ENABLED=1 nativo no Linux).
          # libgtk-3-dev/libwebkit2gtk-4.1-dev: usadas pelo xvpn-client em si (produção).
          # libgtk-4-dev/libwebkitgtk-6.0-dev: só para compilar o binário wails3 CLI
          # via `go install` (internal/operatingsystem detecta a versão do webview
          # via pkg-config em tempo de build do próprio CLI, mesmo sem usá-la em runtime).
          sudo apt-get install -y --no-install-recommends build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Cache go-task/wails3 CLI (recompilar do zero leva minutos)
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: client-tools-${{ runner.os }}-task3.52.0-${{ hashFiles('apps/xvpn-client/go.mod') }}
      - name: Instala go-task e wails3 CLI (ver apps/xvpn-client/README.md)
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          WAILS_VERSION="$(grep -oP 'github.com/wailsapp/wails/v3 \K\S+' go.mod)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: task build (gera frontend/bindings + frontend/dist antes do go build — apps/xvpn-client/main.go embute frontend/dist)
        run: task build
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Arquivos fora do padrão gofmt:"
            echo "$fmt_out"
            exit 1
          fi
      - run: go test ./...

  client-windows-crosscompile:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/xvpn-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/xvpn-client/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/xvpn-client/frontend/package-lock.json
      - name: Dependências p/ compilar o wails3 CLI (não afeta o binário Windows em si — ver client-linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Cache go-task/wails3 CLI (recompilar do zero leva minutos)
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: client-tools-${{ runner.os }}-task3.52.0-${{ hashFiles('apps/xvpn-client/go.mod') }}
      - name: Instala go-task e wails3 CLI (ver apps/xvpn-client/README.md)
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          WAILS_VERSION="$(grep -oP 'github.com/wailsapp/wails/v3 \K\S+' go.mod)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: task build GOOS=windows (só valida que compila — sem runner Windows real, ver PLAN.md)
        run: task build GOOS=windows

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/web/package-lock.json
            apps/xvpn-chat/frontend/package-lock.json
      - name: Dependências do messenger compartilhado (@chat)
        working-directory: apps/xvpn-chat/frontend
        run: npm ci
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  chat-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/xvpn-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/xvpn-chat/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/xvpn-chat/frontend/package-lock.json
      - name: Dependências de build do Wails (GTK/WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Cache go-task/wails3 CLI
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: chat-tools-${{ runner.os }}-task3.52.0-${{ hashFiles('apps/xvpn-chat/go.mod') }}
      - name: Instala go-task e wails3 CLI
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          WAILS_VERSION="$(grep -oP 'github.com/wailsapp/wails/v3 \K\S+' go.mod)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: task build
        run: task build
      - run: go vet ./...
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Arquivos fora do padrão gofmt:"
            echo "$fmt_out"
            exit 1
          fi
      - run: go test ./...
