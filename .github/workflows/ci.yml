name: ci

# CI mínima da Fase 9 (ver ROADMAP.md): build + vet + gofmt + test para os
# dois módulos Go independentes (server, client) e lint + build para o
# painel React. client-windows-crosscompile só valida que compila — não há
# runner Windows real neste projeto, a validação de runtime em Windows
# continua manual (ver PLAN.md).
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Arquivos fora do padrão gofmt:"
            echo "$fmt_out"
            exit 1
          fi
      - run: go test ./...

  client-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - name: Dependências de build do Wails (GTK/WebKit — ver PLAN.md §11)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Arquivos fora do padrão gofmt:"
            echo "$fmt_out"
            exit 1
          fi
      - run: go test ./...

  client-windows-crosscompile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - name: Cross-compile para Windows (só valida que compila)
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
