name: ci

# CI mínima da Fase 9 (ver ROADMAP.md): build + vet + gofmt + test para os
# dois módulos Go independentes (server, client) e lint + build para o
# painel React. client-windows-crosscompile só valida que compila — não há
# runner Windows real neste projeto, a validação de runtime em Windows
# continua manual (ver PLAN.md).
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Arquivos fora do padrão gofmt:"
            echo "$fmt_out"
            exit 1
          fi
      - run: go test ./...

  client-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json
      - name: Dependências de build do Wails (GTK/WebKit — ver PLAN.md §11)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Instala go-task e wails3 CLI (ver client/README.md)
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          WAILS_VERSION="$(grep -oP 'github.com/wailsapp/wails/v3 \K\S+' go.mod)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: task build (gera frontend/bindings + frontend/dist antes do go build — client/main.go embute frontend/dist)
        run: task build
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Arquivos fora do padrão gofmt:"
            echo "$fmt_out"
            exit 1
          fi
      - run: go test ./...

  client-windows-crosscompile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json
      - name: Instala go-task e wails3 CLI (ver client/README.md)
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          WAILS_VERSION="$(grep -oP 'github.com/wailsapp/wails/v3 \K\S+' go.mod)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: task build GOOS=windows (só valida que compila — sem runner Windows real, ver PLAN.md)
        run: task build GOOS=windows

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
