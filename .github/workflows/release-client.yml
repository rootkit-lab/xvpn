name: release-client

# Fase 16.5 — build + GitHub Release na tag xvpn-client-v*, depois sync
# do marketplace. O release-please cria a tag com GITHUB_TOKEN — isso
# NÃO dispara on.push.tags. Depois do land, rode workflow_dispatch com
# a tag (ex. xvpn-client-v0.1.2).
on:
  push:
    tags:
      - "xvpn-client-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex.: xvpn-client-v0.1.2)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/xvpn-client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/xvpn-client/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/xvpn-client/frontend/package-lock.json
      - name: Dependências GTK/WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Cache go-task/wails3
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: client-tools-${{ runner.os }}-task3.52.0-${{ hashFiles('apps/xvpn-client/go.mod') }}
      - name: Instala go-task e wails3
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          WAILS_VERSION="$(grep -oP 'github.com/wailsapp/wails/v3 \K\S+' go.mod)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Versão da tag
        id: ver
        run: |
          VERSION="${RELEASE_TAG#xvpn-client-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Package (.deb)
        run: task package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
      - name: Renomeia artefato versionado
        run: |
          mkdir -p dist
          if ls bin/*.deb >/dev/null 2>&1; then
            cp bin/*.deb "dist/xvpn-client_${VERSION}_amd64.deb"
          else
            echo "nenhum .deb em bin/" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: apps/xvpn-client/dist/*.deb

  windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/xvpn-client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/xvpn-client/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/xvpn-client/frontend/package-lock.json
      - name: Dependências cross-compile
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev nsis
      - name: Cache go-task/wails3
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: client-tools-${{ runner.os }}-task3.52.0-${{ hashFiles('apps/xvpn-client/go.mod') }}-nsis
      - name: Instala go-task e wails3
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          WAILS_VERSION="$(grep -oP 'github.com/wailsapp/wails/v3 \K\S+' go.mod)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Versão da tag
        id: ver
        run: |
          VERSION="${RELEASE_TAG#xvpn-client-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Fetch wintun (se script existir)
        run: |
          if [ -f build/windows/fetch-wintun.ps1 ]; then
            pwsh build/windows/fetch-wintun.ps1 || true
          fi
          if [ -f build/scripts/fetch-wintun.sh ]; then
            bash build/scripts/fetch-wintun.sh || true
          fi
      - name: Package Windows (NSIS) — best-effort no Linux
        continue-on-error: true
        run: |
          GOOS=windows task package || echo "package windows falhou neste runner — artefactos parciais"
          mkdir -p dist
          shopt -s nullglob
          for f in bin/*.exe bin/*setup*; do
            cp "$f" "dist/xvpn-client_${VERSION}_amd64-setup.exe" || cp "$f" dist/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/xvpn-client/dist/*
          if-no-files-found: warn

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publica na GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#xvpn-client-v}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Release automática do cliente XVPN ${VERSION}"
          find artifacts -type f \( -name '*.deb' -o -name '*.exe' \) -print0 | xargs -0 -r gh release upload "$TAG" --clobber
      - name: Dispara sync do marketplace
        env:
          XVPN_PUBLISH_TOKEN: ${{ secrets.XVPN_PUBLISH_TOKEN }}
          XVPN_SYNC_URL: ${{ secrets.XVPN_SYNC_URL }}
        run: |
          if [ -z "${XVPN_PUBLISH_TOKEN}" ] || [ -z "${XVPN_SYNC_URL}" ]; then
            echo "XVPN_PUBLISH_TOKEN / XVPN_SYNC_URL não configurados — sync ignorado"
            exit 0
          fi
          pip install --user pyyaml
          python3 .github/scripts/marketplace-sync-payload.py \
            --commit "${GITHUB_SHA}" \
            --out /tmp/sync.json
          curl -fsS -X POST "${XVPN_SYNC_URL%/}/api/marketplace/sync" \
            -H "Authorization: Bearer ${XVPN_PUBLISH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/sync.json
