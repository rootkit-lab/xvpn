[Service]
# Drop-in: vale mesmo se existir unit antiga em /etc/systemd/system/
# (essa sobrescreve a do pacote e deixava ProtectSystem sem escrita em
# /etc/hosts — Chrome *.corp = NXDOMAIN).
AmbientCapabilities=CAP_NET_ADMIN CAP_DAC_OVERRIDE
CapabilityBoundingSet=CAP_NET_ADMIN CAP_DAC_OVERRIDE
ReadWritePaths=/etc/hosts
