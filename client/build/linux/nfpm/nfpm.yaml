# Empacotamento Linux do xvpn-client (nfpm).
# Versão vem de XVPN_VERSION (exportada pelas tasks generate:deb/rpm/aur
# a partir de build/scripts/resolve-version.sh / release-please).

name: "xvpn-client"
arch: ${GOARCH}
platform: "linux"
version: ${XVPN_VERSION}
section: "net"
priority: "optional"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: |
  Cliente desktop da VPN privada XVPN.
  Instala a GUI e o helper privilegiado (systemd) que gerencia o túnel WireGuard.
vendor: "rootkit-lab"
homepage: "https://vpn.officeempresa.com"
license: "MIT"
release: "1"

contents:
  - src: "./bin/xvpn-client"
    dst: "/usr/local/bin/xvpn-client"
    file_info:
      mode: 0755
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/xvpn-client.png"
  - src: "./build/linux/xvpn-client.desktop"
    dst: "/usr/share/applications/xvpn-client.desktop"
  - src: "./deploy/systemd/xvpn-client-helper.service"
    dst: "/usr/lib/systemd/system/xvpn-client-helper.service"
    file_info:
      mode: 0644

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  preremove: "./build/linux/nfpm/scripts/preremove.sh"
  postremove: "./build/linux/nfpm/scripts/postremove.sh"
