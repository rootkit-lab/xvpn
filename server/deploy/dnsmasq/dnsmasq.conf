# DNS interno da intranet ihuull — só escuta em wg0 (10.66.66.1:53).
# Nunca 0.0.0.0 / eth0. Instalação: ver docs/runbooks/intranet-dnsmasq.md
#
# Bootstrap: copie para /etc/dnsmasq.d/xvpn-corp.conf. Depois do primeiro
# "Aplicar" em /admin/dns este arquivo é regenerado pelo
# xvpn-user-provision dns-apply — não edite à mão.

bind-interfaces
listen-address=10.66.66.1
except-interface=eth0
except-interface=eth1
interface=wg0
no-dhcp-interface=wg0

# Intranet: um rótulo e o wildcard de segundo nível.
address=/corp.ihuull.com/10.66.66.1

# Resto da internet — sem isso o full-tunnel quebra DNS público.
server=8.8.8.8
server=1.1.1.1

domain-needed
bogus-priv
no-resolv
cache-size=1000
