# mongod no VPS — bind só loopback. Sem porta no ufw.
# Cópia de referência: /etc/mongod.conf (trecho net).

storage:
  dbPath: /var/lib/mongodb
  journal:
    enabled: true

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  bindIp: 127.0.0.1

security:
  authorization: enabled
