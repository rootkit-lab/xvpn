# registry — Docker Distribution (registry:2). Bind 127.0.0.1:5000. Sem ufw.
server {
    listen 10.66.66.1:443 ssl;
    http2 on;
    server_name registry.corp.ihuull.com;

    ssl_certificate     /etc/letsencrypt/live/corp.ihuull.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corp.ihuull.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 10.66.66.0/24;
    allow 172.17.0.0/16; # docker0 — codespace. Sem eth0.
    deny all;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location /v2/ {
        auth_request /internal/registry-auth;
        error_page 401 = @registry_unauth;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /internal/registry-auth {
        internal;
        proxy_pass http://127.0.0.1:8080/api/registry/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /api/registry/token {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @registry_unauth {
        add_header WWW-Authenticate 'Bearer realm="https://registry.corp.ihuull.com/api/registry/token",service="registry.corp.ihuull.com"' always;
        default_type application/json;
        return 401 '{"errors":[{"code":"UNAUTHORIZED","message":"authentication required"}]}';
    }
}

# pages — blob estático. Disco /opt/xvpn/data/pages/<org>/<slug>/. Sem ufw.
server {
    listen 10.66.66.1:443 ssl;
    http2 on;
    server_name pages.corp.ihuull.com;

    ssl_certificate     /etc/letsencrypt/live/corp.ihuull.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corp.ihuull.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 10.66.66.0/24;
    deny all;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/xvpn/data/pages;
    index index.html;
    try_files $uri $uri/ =404;
}

