# Intranet *.corp.ihuull.com — SOMENTE 10.66.66.1:443.
# Sem listen em 0.0.0.0 / IPv6 público. allow só a subnet WireGuard.
# Certificado via DNS-01 (*.corp.ihuull.com) — ver docs/runbooks/cloudflare-dns.md
#
# Cópia de referência. Fonte operacional: /etc/nginx/sites-available/xvpn-corp.conf

# HTTP na wg0 só para health interno — sem ACME HTTP-01 (cert é DNS-01).
server {
    listen 10.66.66.1:80;
    server_name corp.ihuull.com xchat.corp.ihuull.com xgroup.corp.ihuull.com xdriver.corp.ihuull.com xadmin.corp.ihuull.com xgit.corp.ihuull.com xcodespaces.corp.ihuull.com registry.corp.ihuull.com pages.corp.ihuull.com;
    allow 10.66.66.0/24;
    deny all;
    return 301 https://$host$request_uri;
}

# xchat + xgroup — mesmo backend do core (127.0.0.1:8080).
server {
    listen 10.66.66.1:443 ssl;
    http2 on;
    server_name xchat.corp.ihuull.com xgroup.corp.ihuull.com corp.ihuull.com xadmin.corp.ihuull.com;

    ssl_certificate     /etc/letsencrypt/live/corp.ihuull.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corp.ihuull.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    allow 10.66.66.0/24;
    deny all;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/social/attachments {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 40m;
    }
}

