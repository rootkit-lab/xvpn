# Landing pública: www.ihuull.com / ihuull.com e marketing xchat.ihuull.com
# (sem API/WS). ihuu.com só entra quando o A apontar para este VPS.
# Cópia de referência — /etc/nginx/sites-available/ihuull-landing.conf
# Listen no IP da eth0 — 10.66.66.1 fica para *.corp.

server {
    listen 206.189.224.72:80;
    server_name www.ihuull.com ihuull.com xchat.ihuull.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 206.189.224.72:443 ssl;
    http2 on;
    server_name www.ihuull.com ihuull.com xchat.ihuull.com;

    ssl_certificate     /etc/letsencrypt/live/www.ihuull.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ihuull.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 1m;

    # Mesmo binário do core — a landing já vive em /. Sem /api/ws neste
    # hostname de marketing (xchat.ihuull.com não é o messenger).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
