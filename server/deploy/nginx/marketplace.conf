# Marketplace — marketplace.ihuull.com (UI tipo Play Store).
# Cópia de referência. Fonte operacional: /etc/nginx/sites-available/xvpn-marketplace.conf
#
# Mesmo backend do core (127.0.0.1:8080). Download autenticado (JWE).
# Listen no IP público da eth0 — 10.66.66.1 fica para *.corp (corp.conf).

server {
    listen 206.189.224.72:80;
    server_name marketplace.ihuull.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 206.189.224.72:443 ssl;
    http2 on;
    server_name marketplace.ihuull.com;

    ssl_certificate     /etc/letsencrypt/live/marketplace.ihuull.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketplace.ihuull.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Download autenticado — corpo grande só neste path (GET).
    location ~ ^/api/marketplace/assets/[0-9]+/download$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
