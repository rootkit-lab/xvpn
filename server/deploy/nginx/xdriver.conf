# xdriver.ihuull.com NÃO é produto. Drive só em xdriver.corp (wg0).
# Cópia de referência. Fonte operacional: /etc/nginx/sites-available/xvpn-xdriver.conf
#
# O wildcard *.ihuull.com ainda resolve este nome — o bloco existe só
# para não cair no default (landing) e para renovar o cert HTTP-01.
# HTTPS fecha a conexão (444). Sem VPN o .corp não resolve.

server {
    listen 206.189.224.72:80;
    server_name xdriver.ihuull.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 444;
    }
}

server {
    listen 206.189.224.72:443 ssl;
    http2 on;
    server_name xdriver.ihuull.com;

    ssl_certificate     /etc/letsencrypt/live/xdriver.ihuull.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xdriver.ihuull.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        return 444;
    }
}
