# XDriver portal público — xdriver.ihuull.com (UI tipo Drive).
# Cópia de referência. Fonte operacional: /etc/nginx/sites-available/xvpn-xdriver.conf
#
# SÓ o SPA + API do core (127.0.0.1:8080). NUNCA proxy para :8081 / FileBrowser.
# Arquivos reais: xdriver.corp.ihuull.com → 10.66.66.1:8081 (corp.conf, só wg0).

server {
    listen 206.189.224.72:80;
    server_name xdriver.ihuull.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 206.189.224.72:443 ssl;
    http2 on;
    server_name xdriver.ihuull.com;

    ssl_certificate     /etc/letsencrypt/live/xdriver.ihuull.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xdriver.ihuull.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 1m;

    # Sem /api/ws e sem proxy para FileBrowser.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
