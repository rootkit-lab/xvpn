# Marketing xgroup — xgroup.ihuull.com (conecte a VPN / abra o app).
# Cópia de referência. Fonte operacional (quando o A existir):
# /etc/nginx/sites-available/xvpn-xgroup.conf
#
# SÓ o SPA do core (127.0.0.1:8080). Sem /api/ws e sem /api/social/*.
# App real: xgroup.corp.ihuull.com → 127.0.0.1:8080 (corp.conf, só wg0).
#
# Ainda sem A no Cloudflare — não ligar este block até o A + cert existirem.

server {
    listen 206.189.224.72:80;
    server_name xgroup.ihuull.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 206.189.224.72:443 ssl;
    http2 on;
    server_name xgroup.ihuull.com;

    ssl_certificate     /etc/letsencrypt/live/xgroup.ihuull.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xgroup.ihuull.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 1m;

    # Sem /api/ws e sem proxy de social — marketing only.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
