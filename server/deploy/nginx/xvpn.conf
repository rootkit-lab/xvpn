# Server block do XVPN, aplicado no VPS em /etc/nginx/sites-available/
# (Fase 0). Cópia de referência para o repositório — a fonte da verdade
# operacional é o arquivo real no servidor; edite lá e sincronize aqui.
#
# Nginx é compartilhado com o landpages-ops (ver PLAN.md §3.3/§5) — nunca
# assuma que este é o único server block do host.

server {
    listen 80;
    server_name vpn.officeempresa.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name vpn.officeempresa.com;

    ssl_certificate     /etc/letsencrypt/live/vpn.officeempresa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.officeempresa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Padrão do Nginx (1m) para toda a API/painel — de propósito, pequeno.
    # POST /api/auth/login e /api/waitlist são públicos (sem JWT); um
    # limite grande aqui deixaria qualquer anônimo forçar o Nginx a
    # bufferizar corpos multi-gigabyte antes mesmo do Go rejeitar. A
    # exceção de upload grande do marketplace vive isolada abaixo, nunca
    # neste location catch-all (achado do Bugbot na revisão da Fase 11).
    client_max_body_size 1m;

    # Backend real a partir da Fase 2 (xvpn-server.service, 127.0.0.1:8080).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Descarta XFF do cliente ($remote_addr, não $proxy_add_x_forwarded_for):
        # o backend só confia no loopback; anexar o header forjado era o
        # bypass do rate limit corrigido em #28. Defesa em profundidade.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Único endpoint autenticado (adminOnly) que aceita corpo grande:
    # upload de asset do marketplace até marketplace.MaxAssetSize (2 GiB)
    # + folga de framing multipart no próprio handler Go (PLAN.md §6.8).
    # Isolado em location própria — nunca no catch-all acima — para não
    # dar a mesma folga a rotas públicas/pequenas (login, waitlist, JSON
    # da API em geral).
    location ~ ^/api/marketplace/versions/[0-9]+/assets$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 2200m;
    }
}
