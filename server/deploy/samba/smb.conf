#
# smb.conf do XVPN — compartilhamento de arquivos restrito à VPN.
#
# Invariante de segurança (ver AGENTS.md e PLAN.md §3.4): Samba nunca pode
# escutar na interface pública (eth0). "bind interfaces only" + "interfaces"
# garantem isso no nível do próprio serviço — defesa em profundidade, não
# depende só do firewall (que também nunca libera 139/445 para o eth0).
#
# Instalado em /etc/samba/smb.conf no VPS (ver server/README.md § Deploy).
#

[global]
    workgroup = WORKGROUP
    server string = XVPN File Share
    netbios name = xvpn

    # Só escuta em wg0 (10.66.66.1) e loopback — nunca em eth0/IP público,
    # mesmo que o firewall falhe. Especificar por IP/CIDR, não pelo nome da
    # interface ("wg0"): o Samba detecta interfaces automaticamente supondo
    # broadcast/netmask convencionais, e wg0 é ponto-a-ponto (sem
    # broadcast) — com "interfaces = wg0 lo" o smbd silenciosamente cai só
    # em 127.0.0.1, achado ao validar a Fase 5 via túnel real.
    bind interfaces only = yes
    interfaces = 10.66.66.1/24 127.0.0.1/8

    # Defesa em profundidade adicional: mesmo alguém conseguindo rotear até
    # a interface errada, o smbd rejeita qualquer origem fora da sub-rede
    # WireGuard.
    hosts allow = 10.66.66.0/24 127.0.0.1
    hosts deny = 0.0.0.0/0

    # SMB1 é obsoleto e tem histórico de vulnerabilidades graves (ex.:
    # EternalBlue) — exige SMB2 ou mais novo.
    server min protocol = SMB2_10
    client min protocol = SMB2_10

    security = user
    map to guest = never
    guest account = nobody

    # Sem impressão/spool — este servidor só compartilha arquivos.
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    # NetBIOS (porta 139/nmbd) não é necessário: clientes modernos
    # (Windows 10+/11, GVFS no Linux) resolvem por IP direto via SMB2/3 na
    # porta 445. Mantém a superfície de ataque menor.
    smb ports = 445

    log file = /var/log/samba/log.%m
    max log size = 1000
    logging = systemd

[shared]
    comment = Compartilhamento geral do XVPN
    path = /srv/xvpn/shared
    valid users = @xvpn-samba
    read only = no
    browsable = yes
    guest ok = no
    create mask = 0660
    directory mask = 0770
    force group = xvpn-samba
