#
# smb.conf do XVPN — compartilhamento de arquivos restrito à VPN.
#
# Invariante de segurança (ver AGENTS.md e PLAN.md §3.4): Samba nunca pode
# escutar na interface pública (eth0). "bind interfaces only" + "interfaces"
# garantem isso no nível do próprio serviço — defesa em profundidade, não
# depende só do firewall (que também nunca libera 139/445 para o eth0).
#
# Instalado em /etc/samba/smb.conf no VPS (ver server/README.md § Deploy).
#
# ATENÇÃO À ORDEM: a linha `include` dos shares por usuário fica no FIM
# deste arquivo, depois de todas as seções, e não pode subir para o
# [global]. O motivo está documentado junto da própria linha, no final.
#

[global]
    workgroup = WORKGROUP
    server string = XVPN File Share
    netbios name = xvpn

    # Só escuta em wg0 (10.66.66.1) e loopback — nunca em eth0/IP público,
    # mesmo que o firewall falhe. Especificar por IP/CIDR, não pelo nome da
    # interface ("wg0"): o Samba detecta interfaces automaticamente supondo
    # broadcast/netmask convencionais, e wg0 é ponto-a-ponto (sem
    # broadcast) — com "interfaces = wg0 lo" o smbd silenciosamente cai só
    # em 127.0.0.1, achado ao validar a Fase 5 via túnel real.
    bind interfaces only = yes
    interfaces = 10.66.66.1/24 127.0.0.1/8

    # Defesa em profundidade adicional: mesmo alguém conseguindo rotear até
    # a interface errada, o smbd rejeita qualquer origem fora da sub-rede
    # WireGuard.
    hosts allow = 10.66.66.0/24 127.0.0.1
    hosts deny = 0.0.0.0/0

    # SMB1 é obsoleto e tem histórico de vulnerabilidades graves (ex.:
    # EternalBlue) — exige SMB2 ou mais novo.
    server min protocol = SMB2_10
    client min protocol = SMB2_10

    security = user

    # "Bad User" mapeia usuário desconhecido para a conta guest em vez de
    # rejeitar a conexão. Os shares [home-<user>] dependem inteiramente
    # disso: eles usam "guest ok = yes" + "force user = <user>" (decisão da
    # Fase 13 — a VPN autenticada é a barreira de acesso, para não criar
    # uma senha Samba separada por usuário). Com "never", o cliente é
    # rejeitado já no session setup e o share nunca abre. Não usar "Bad
    # Password": mascararia senha errada como guest, inclusive no [shared].
    #
    # Consequência importante: é este parâmetro que torna o bind exclusivo
    # em wg0 (acima) load-bearing e não apenas defensivo — quem alcança a
    # porta 445 alcança os shares pessoais sem apresentar credencial. Por
    # isso o invariante 2 do AGENTS.md não é substituível pelo firewall.
    map to guest = Bad User
    guest account = nobody

    # Sem impressão/spool — este servidor só compartilha arquivos.
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    # NetBIOS (porta 139/nmbd) não é necessário: clientes modernos
    # (Windows 10+/11, GVFS no Linux) resolvem por IP direto via SMB2/3 na
    # porta 445. Mantém a superfície de ataque menor.
    smb ports = 445

    log file = /var/log/samba/log.%m
    max log size = 1000
    logging = systemd

[shared]
    comment = Compartilhamento geral do XVPN
    path = /srv/xvpn/shared
    # Guest + force user, mesma decisão da Fase 13 nos shares pessoais:
    # a VPN autenticada é a barreira — o cliente abre smb://…/shared sem
    # senha Samba (Fase 14, ROADMAP). force user precisa ser uma conta
    # Unix no grupo xvpn-samba com permissão de escrita em
    # /srv/xvpn/shared; o deploy cria o usuário de sistema
    # "xvpn-shared" (nologin, sem home) para isso.
    force user = xvpn-shared
    force group = xvpn-samba
    read only = no
    browsable = yes
    guest ok = yes
    create mask = 0660
    directory mask = 0770

# ---------------------------------------------------------------------------
# Shares por usuário ([home-<user>]), gerados pelo xvpn-user-provision.
#
# ESTA LINHA PRECISA CONTINUAR SENDO A ÚLTIMA DO ARQUIVO. Não mova para o
# [global] "para organizar": o `include` do Samba não abre um escopo
# isolado como o Include do sshd — ele insere o conteúdo do arquivo
# literalmente nesta posição, e a seção corrente atravessa a fronteira do
# include. Como o agregado declara seções ([home-alice], [home-bob], ...),
# tudo que viesse DEPOIS do include dentro do [global] deixaria de ser
# global no instante em que o primeiro share pessoal passasse a existir.
#
# O estrago concreto, reproduzido com `testparm -s` e um share pessoal
# presente: "bind interfaces only" volta ao default "no" e "interfaces"
# fica vazio — o smbd passa a escutar em TODAS as interfaces, violando o
# invariante 2 do AGENTS.md; "map to guest" volta a "Never", derrubando o
# guest de que os [home-<user>] dependem; "hosts allow"/"hosts deny"
# migram para dentro do share. E o `testparm` sai com código 0 nesse
# cenário, imprimindo só avisos "Global parameter X found in service
# section!" — por isso o ReloadSamba (server/internal/provision/runner.go)
# trata esses avisos como erro e aborta o reload.
#
# Com o include aqui no fim, a seção corrente no momento da inserção é a
# [shared], que já está inteiramente declarada acima. O único efeito
# visível é o próprio "include" aparecer listado dentro de [shared] no
# `testparm -s` — inofensivo, nenhum parâmetro global é perdido.
# ---------------------------------------------------------------------------
include = /etc/samba/smb.conf.d/xvpn-shares.conf
