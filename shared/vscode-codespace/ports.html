<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: oklch(0.11 0.012 260);
  --fg: oklch(0.98 0.005 260);
  --muted: oklch(0.7 0.02 260);
  --card: oklch(0.18 0.014 260);
  --border: oklch(1 0 0 / 8%);
  --primary: oklch(0.72 0.14 230);
  --safe: oklch(0.72 0.17 150);
  --warn: oklch(0.78 0.16 85);
  --font: Outfit, ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font); background: var(--bg); color: var(--fg);
  display: flex; flex-direction: column; height: 100%;
}
.bar {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
}
.bar .label {
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted);
}
.bar .host {
  margin-top: 4px; font-family: var(--mono); font-size: 12px;
  word-break: break-all; color: var(--fg);
}
.bar .hint {
  margin-top: 6px; font-size: 11px; line-height: 1.4; color: var(--muted);
}
#list { flex: 1; overflow: auto; padding: 8px; }
.row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px 12px;
  align-items: center;
  padding: 10px 12px;
  margin-bottom: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.port {
  font-family: var(--mono); font-weight: 600; font-size: 14px;
}
.meta { min-width: 0; }
.url {
  display: block;
  font-family: var(--mono); font-size: 11px;
  color: var(--primary); word-break: break-all;
  text-decoration: none;
}
.url:hover { text-decoration: underline; }
.bind { font-size: 11px; color: var(--muted); margin-top: 3px; }
.bind.warn { color: var(--warn); }
.actions { display: flex; gap: 6px; flex-shrink: 0; }
.btn {
  background: transparent; color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 10px; font-size: 11px; cursor: pointer;
  font-family: var(--font);
}
.btn.primary {
  background: var(--primary); color: oklch(0.16 0.02 230); border-color: transparent;
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.empty {
  padding: 28px 16px; text-align: center; color: var(--muted);
  font-size: 13px; line-height: 1.5;
}
</style>
</head>
<body>
<div class="bar">
  <div class="label">Preview intranet</div>
  <div class="host" id="host">a resolver hostname…</div>
  <div class="hint">HTTP em <code>demo-*</code>. Não uses <code>cs-*:porta</code> — o IDE tem HSTS e o browser sobe para HTTPS.</div>
</div>
<div id="list"><div class="empty">Escaneando portas…</div></div>
<script>
const vscode = acquireVsCodeApi();
const list = document.getElementById("list");
const hostEl = document.getElementById("host");
let demoHost = "";

window.addEventListener("message", (ev) => {
  const msg = ev.data;
  if (msg?.type === "ports") {
    const next = String(msg.demoHost || "");
    demoHost = /^demo-[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.corp\.ihuull\.com$/i.test(next) ? next.toLowerCase() : "";
    hostEl.textContent = demoHost || "hostname demo-* ainda não chegou — Recreate o codespace";
    render(msg.ports || [], msg.recipes || []);
  }
});

function isDemoPreviewUrl(raw) {
  try {
    const u = new URL(String(raw || ""));
    if (u.protocol !== "http:" || u.username || u.password) return false;
    if ((u.pathname && u.pathname !== "/") || u.search || u.hash) return false;
    const port = Number(u.port);
    if (!Number.isInteger(port) || port < 1 || port > 65535) return false;
    return /^demo-[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.corp\.ihuull\.com$/i.test(u.hostname);
  } catch (_) {
    return false;
  }
}

function openUrl(url) {
  if (!isDemoPreviewUrl(url)) {
    return;
  }
  vscode.postMessage({ type: "open", url });
}

function copyUrl(url) {
  if (!isDemoPreviewUrl(url)) {
    return;
  }
  vscode.postMessage({ type: "copy", url });
}

function render(ports, recipes) {
  list.replaceChildren();
  if (!ports.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.append("Nenhuma porta em 0.0.0.0.");
    const starts = (recipes || []).filter((r) => r && (r.port || r.id === "flask" || r.id === "npm-start" || r.id === "node-index"));
    const show = starts.length ? starts : recipes || [];
    if (show.length) {
      empty.append(document.createElement("br"), "Pode iniciar:");
      show.slice(0, 4).forEach((r) => {
        empty.append(document.createElement("br"));
        const label = document.createElement("span");
        label.textContent = (r.label || r.lang || "app") + ": ";
        const code = document.createElement("code");
        code.textContent = r.cmd || "";
        empty.append(label, code);
      });
    }
    list.appendChild(empty);
    return;
  }
  ports.forEach((p) => {
    const port = typeof p === "number" ? p : p.port;
    const addr = typeof p === "object" && p.addr ? String(p.addr) : "0.0.0.0";
    const ok = typeof p === "object" ? p.public !== false : true;
    const url = demoHost ? "http://" + demoHost + ":" + port : "";
    const ready = Boolean(url && isDemoPreviewUrl(url));

    const row = document.createElement("div");
    row.className = "row";

    const portEl = document.createElement("span");
    portEl.className = "port";
    portEl.textContent = ":" + port;

    const meta = document.createElement("div");
    meta.className = "meta";
    if (ready) {
      const link = document.createElement("a");
      link.className = "url";
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = url;
      link.addEventListener("click", (ev) => {
        ev.preventDefault();
        openUrl(url);
      });
      meta.appendChild(link);
    } else {
      const miss = document.createElement("span");
      miss.className = "url";
      miss.textContent = "à espera do hostname demo-*";
      meta.appendChild(miss);
    }
    const bind = document.createElement("div");
    bind.className = "bind" + (ok ? "" : " warn");
    bind.textContent = ok ? "bind " + addr : "bind " + addr + " — usa 0.0.0.0";
    meta.appendChild(bind);

    const actions = document.createElement("div");
    actions.className = "actions";
    const copy = document.createElement("button");
    copy.type = "button";
    copy.className = "btn";
    copy.textContent = "Copiar";
    copy.disabled = !ready;
    copy.addEventListener("click", () => copyUrl(url));
    const open = document.createElement("button");
    open.type = "button";
    open.className = "btn primary";
    open.textContent = "Abrir";
    open.disabled = !ready;
    open.addEventListener("click", () => openUrl(url));
    actions.append(copy, open);

    row.append(portEl, meta, actions);
    list.appendChild(row);
  });
}

vscode.postMessage({ type: "ready" });
</script>
</body>
</html>
