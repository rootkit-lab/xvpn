<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: oklch(0.11 0.012 260);
  --fg: oklch(0.98 0.005 260);
  --muted-fg: oklch(0.7 0.02 260);
  --border: oklch(1 0 0 / 8%);
  --primary: oklch(0.72 0.14 230);
  --safe: oklch(0.72 0.17 150);
  --warn: oklch(0.78 0.16 85);
  --font-mono: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
}
html, body { height: 100%; margin: 0; }
body {
  font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
  background: var(--bg); color: var(--fg);
  display: flex; flex-direction: column; height: 100%;
}
.bar {
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--muted-fg);
}
.bar strong {
  color: var(--fg); font-weight: 600;
  font-family: var(--font-mono); font-size: 11px;
  word-break: break-all; overflow-wrap: anywhere;
}
#list { flex: 1; overflow: auto; padding: 8px 0; }
.row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 12px; border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.row:hover { background: oklch(1 0 0 / 4%); }
.dot {
  width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0;
  margin-top: 6px;
  background: var(--safe); box-shadow: 0 0 8px color-mix(in oklch, var(--safe) 60%, transparent);
}
.dot.warn {
  background: var(--warn);
  box-shadow: 0 0 8px color-mix(in oklch, var(--warn) 50%, transparent);
}
.port { font-family: var(--font-mono); font-weight: 600; min-width: 4.5rem; padding-top: 2px; }
.meta { flex: 1; min-width: 0; }
.url {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--primary); word-break: break-all; overflow-wrap: anywhere;
  text-decoration: underline; cursor: pointer;
}
.bind { font-size: 11px; color: var(--muted-fg); margin-top: 2px; }
.bind.warn { color: var(--warn); }
.btn {
  background: color-mix(in oklch, var(--primary) 18%, transparent);
  color: var(--primary); border: 1px solid color-mix(in oklch, var(--primary) 35%, transparent);
  border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer;
  flex-shrink: 0; margin-top: 2px;
}
.btn:hover { background: color-mix(in oklch, var(--primary) 28%, transparent); }
.empty {
  padding: 24px 16px; text-align: center; color: var(--muted-fg); font-size: 13px; line-height: 1.5;
}
</style>
</head>
<body>
<div class="bar">Preview intranet<br><strong id="host">aguardando hostname demo-…</strong></div>
<div id="list"><div class="empty">Escaneando portas…</div></div>
<script>
const vscode = acquireVsCodeApi();
const list = document.getElementById("list");
const hostEl = document.getElementById("host");
let demoHost = "";

window.addEventListener("message", (ev) => {
  const msg = ev.data;
  if (msg?.type === "ports") {
    demoHost = msg.demoHost || demoHost;
    if (demoHost) hostEl.textContent = demoHost;
    render(msg.ports || []);
  }
});

function openUrl(url) {
  if (!url || !url.startsWith("http://")) {
    return;
  }
  try {
    window.open(url, "_blank", "noopener,noreferrer");
  } catch (_) {
    /* webview pode bloquear; o host tenta openExternal */
  }
  vscode.postMessage({ type: "open", url });
}

function render(ports) {
  if (!ports.length) {
    list.innerHTML = '<div class="empty">Nenhuma porta detectada.<br>Flask: <code>python3 web/flask/app.py</code> (0.0.0.0:8080)</div>';
    return;
  }
  list.innerHTML = ports.map((p) => {
    const port = typeof p === "number" ? p : p.port;
    const addr = typeof p === "object" && p.addr ? p.addr : "0.0.0.0";
    const ok = typeof p === "object" ? p.public !== false : true;
    const url = demoHost ? `http://${demoHost}:${port}` : `:${port}`;
    const bind = ok ? `bind ${addr}` : `bind ${addr} — use 0.0.0.0 p/ demo-*`;
    const href = url.startsWith("http://") ? url : "";
    return `<div class="row"><span class="dot${ok ? "" : " warn"}" title="online"></span><span class="port">:${port}</span><div class="meta"><a class="url" data-u="${url}" ${href ? `href="${href}"` : ""} target="_blank" rel="noopener">${url}</a><div class="bind${ok ? "" : " warn"}">${bind}</div></div><button type="button" class="btn" data-u="${url}">Abrir</button></div>`;
  }).join("");
  list.querySelectorAll("[data-u]").forEach((el) => {
    el.addEventListener("click", (ev) => {
      ev.preventDefault();
      openUrl(el.getAttribute("data-u") || "");
    });
  });
}

vscode.postMessage({ type: "ready" });
</script>
</body>
</html>
